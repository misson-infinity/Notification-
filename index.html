<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বৈরাচারীকে জুতা মারো</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        h1 {
            color: #d32f2f;
        }
        canvas {
            background-color: white;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <h1>স্বৈরাচারীকে জুতা মারো!</h1>
    <p>স্কোর: <span id="score">0</span></p>
    <canvas id="gameCanvas"></canvas>
    <audio id="hitSound" src="hit.mp3"></audio> <!-- **ঠাস! শব্দ** -->

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 800;
        canvas.height = 500;

        let score = 0;
        const hitSound = document.getElementById("hitSound");

        // **স্বৈরাচারীর মাথা (Picsart_25-02-12_18-21-46-138.png)**
        const dictator = {
            x: Math.random() * (canvas.width - 100),
            y: Math.random() * (canvas.height - 100),
            width: 80,
            height: 80,
            dx: 2,
            dy: 2,
            image: new Image(),
        };
        dictator.image.src = "Picsart_25-02-12_18-21-46-138.png"; // **স্বৈরাচারীর নতুন ছবি**

        // **জুতা (Picsart_25-02-12_18-22-15-576.png)**
        const shoe = {
            x: 100,
            y: 400,
            width: 50,
            height: 50,
            image: new Image(),
            moving: false,
            targetX: 0,
            targetY: 0,
            speed: 5,
        };
        shoe.image.src = "Picsart_25-02-12_18-22-15-576.png"; // **জুতার নতুন ছবি**

        canvas.addEventListener("click", () => {
            if (!shoe.moving) {
                shoe.moving = true;
                shoe.targetX = dictator.x + dictator.width / 2 - shoe.width / 2;
                shoe.targetY = dictator.y + dictator.height / 2 - shoe.height / 2;
            }
        });

        function moveDictator() {
            dictator.x += dictator.dx;
            dictator.y += dictator.dy;

            if (dictator.x <= 0 || dictator.x + dictator.width >= canvas.width) {
                dictator.dx *= -1;
            }
            if (dictator.y <= 0 || dictator.y + dictator.height >= canvas.height) {
                dictator.dy *= -1;
            }
        }

        function moveShoe() {
            if (shoe.moving) {
                let dx = shoe.targetX - shoe.x;
                let dy = shoe.targetY - shoe.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > shoe.speed) {
                    shoe.x += (dx / distance) * shoe.speed;
                    shoe.y += (dy / distance) * shoe.speed;
                } else {
                    shoe.x = shoe.targetX;
                    shoe.y = shoe.targetY;
                    shoe.moving = false;
                    checkHit();
                }
            }
        }

        function checkHit() {
            if (
                shoe.x < dictator.x + dictator.width &&
                shoe.x + shoe.width > dictator.x &&
                shoe.y < dictator.y + dictator.height &&
                shoe.y + shoe.height > dictator.y
            ) {
                score++;
                document.getElementById("score").innerText = score;
                hitSound.play();
            }
            shoe.x = 100;
            shoe.y = 400;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(dictator.image, dictator.x, dictator.y, dictator.width, dictator.height);
            ctx.drawImage(shoe.image, shoe.x, shoe.y, shoe.width, shoe.height);
        }

        function gameLoop() {
            moveDictator();
            moveShoe();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
