<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>স্বৈরাচারীকে জুতা মারো!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background: #1e272e;
            color: white;
        }
        h1 {
            margin-top: 20px;
            font-size: 28px;
            color: #f1c40f;
        }
        p {
            font-size: 20px;
            margin: 10px 0;
        }
        .info {
            font-size: 18px;
            margin: 10px 0;
            color: #ff4757;
        }
        canvas {
            display: block;
            background: url('background.jpg') no-repeat center center/cover;
            margin: 20px auto;
            border: 3px solid white;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        #restart {
            padding: 10px 20px;
            font-size: 18px;
            background: #2ecc71;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <h1>স্বৈরাচারীকে জুতা মারো!</h1>
    <p>স্কোর: <span id="score">0</span></p>
    <p class="info">সময় বাকি: <span id="timer">30</span> সেকেন্ড</p>
    <canvas id="gameCanvas"></canvas>
    <button id="restart">আবার খেলো</button>

    <audio id="hitSound" src="hit.mp3"></audio> <!-- জুতা লাগলে শব্দ -->
    <audio id="missSound" src="miss.mp3"></audio> <!-- মিস করলে শব্দ -->

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        canvas.width = 800;
        canvas.height = 500;

        let score = 0;
        let timeLeft = 30;
        let gameRunning = true;
        
        const hitSound = document.getElementById("hitSound");
        const missSound = document.getElementById("missSound");

        const dictator = {
            x: Math.random() * (canvas.width - 100),
            y: Math.random() * (canvas.height - 100),
            width: 100,
            height: 100,
            dx: 3,
            dy: 2,
            image: new Image(),
        };
        dictator.image.src = "Picsart_25-02-12_18-21-46-138.png"; 

        const shoe = {
            x: 100,
            y: 400,
            width: 50,
            height: 50,
            image: new Image(),
            moving: false,
            targetX: 0,
            targetY: 0,
            speed: 7,
        };
        shoe.image.src = "Picsart_25-02-12_18-22-15-576.png"; 

        canvas.addEventListener("click", (event) => {
            if (!shoe.moving && gameRunning) {
                shoe.moving = true;
                shoe.targetX = dictator.x + dictator.width / 2 - shoe.width / 2;
                shoe.targetY = dictator.y + dictator.height / 2 - shoe.height / 2;
            }
        });

        function moveDictator() {
            dictator.x += dictator.dx;
            dictator.y += dictator.dy;

            if (dictator.x <= 0 || dictator.x + dictator.width >= canvas.width) {
                dictator.dx *= -1;
            }
            if (dictator.y <= 0 || dictator.y + dictator.height >= canvas.height) {
                dictator.dy *= -1;
            }
        }

        function moveShoe() {
            if (shoe.moving) {
                let dx = shoe.targetX - shoe.x;
                let dy = shoe.targetY - shoe.y;
                let distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > shoe.speed) {
                    shoe.x += (dx / distance) * shoe.speed;
                    shoe.y += (dy / distance) * shoe.speed;
                } else {
                    shoe.x = shoe.targetX;
                    shoe.y = shoe.targetY;
                    shoe.moving = false;
                    checkHit();
                }
            }
        }

        function checkHit() {
            if (
                shoe.x < dictator.x + dictator.width &&
                shoe.x + shoe.width > dictator.x &&
                shoe.y < dictator.y + dictator.height &&
                shoe.y + shoe.height > dictator.y
            ) {
                score++;
                document.getElementById("score").innerText = score;
                hitSound.play();
                shakeDictator();

                if (score % 10 === 0) {
                    dictator.dx += 1;
                    dictator.dy += 1;
                }
            } else {
                missSound.play();
            }
            shoe.x = 100;
            shoe.y = 400;
        }

        function shakeDictator() {
            let originalX = dictator.x;
            let originalY = dictator.y;
            let count = 0;
            let interval = setInterval(() => {
                dictator.x = originalX + (Math.random() * 10 - 5);
                dictator.y = originalY + (Math.random() * 10 - 5);
                count++;
                if (count > 5) {
                    clearInterval(interval);
                    dictator.x = originalX;
                    dictator.y = originalY;
                }
            }, 50);
        }

        function startTimer() {
            let timer = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    document.getElementById("timer").innerText = timeLeft;
                } else {
                    clearInterval(timer);
                    gameRunning = false;
                    document.getElementById("restart").style.display = "block";
                }
            }, 1000);
        }

        function restartGame() {
            score = 0;
            timeLeft = 30;
            gameRunning = true;
            dictator.dx = 3;
            dictator.dy = 2;
            document.getElementById("score").innerText = score;
            document.getElementById("timer").innerText = timeLeft;
            document.getElementById("restart").style.display = "none";
            startTimer();
        }

        document.getElementById("restart").addEventListener("click", restartGame);

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(dictator.image, dictator.x, dictator.y, dictator.width, dictator.height);
            ctx.drawImage(shoe.image, shoe.x, shoe.y, shoe.width, shoe.height);
        }

        function gameLoop() {
            if (gameRunning) {
                moveDictator();
                moveShoe();
                draw();
                requestAnimationFrame(gameLoop);
            }
        }

        startTimer();
        gameLoop();
    </script>
</body>
</html>
